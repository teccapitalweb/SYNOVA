<!DOCTYPE html>
<html lang="es" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B121F">
<title>SYNOVA · Panel VIP</title>
<link rel="icon" type="image/png" href="assets/img/synova-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none;cursor:pointer}
img{display:block;max-width:100%}
svg{flex-shrink:0}
input,textarea,select{font:inherit;color:inherit}
ul{list-style:none}
::selection{background:var(--primary);color:#fff}

:root[data-theme="night"]{
  --bg:#0B121F;--bg-deep:#070B12;
  --surface:#101A2C;--surface-2:#16223A;--surface-3:#223353;
  --border:rgba(140,190,230,0.08);--border-2:rgba(140,190,230,0.15);--border-strong:rgba(140,190,230,0.24);
  --text:#EAF2FA;--text-2:#A9BBD1;--text-3:#7C8FA8;
  --primary:#1C6FB0;--primary-soft:#5FB6E0;--primary-deep:#0B4A7C;
  --primary-glow:rgba(28,111,176,0.42);--highlight:#2FD1C6;
  --success:#34D399;--warn:#FBBF24;--danger:#F87171;
  --shadow-card:0 20px 60px rgba(0,0,0,0.5);
}
:root[data-theme="day"]{
  --bg:#EEF5FC;--bg-deep:#DCEAF7;
  --surface:#FFFFFF;--surface-2:#F3F9FE;--surface-3:#E3EFF9;
  --border:rgba(11,58,102,0.08);--border-2:rgba(11,58,102,0.14);--border-strong:rgba(11,58,102,0.24);
  --text:#0B2A4A;--text-2:#3E5975;--text-3:#7891A8;
  --primary:#0D5FA0;--primary-soft:#3D8FCB;--primary-deep:#0A3E68;
  --primary-glow:rgba(13,95,160,0.24);--highlight:#159E92;
  --success:#0F9D58;--warn:#B45309;--danger:#DC2D3F;
  --shadow-card:0 16px 50px rgba(11,58,102,0.12);
}
body{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Plus Jakarta Sans','Inter',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ═══ Gate de sesión ═══ */
body:not(.auth-ready) .app-shell{display:none !important}
body.auth-ready .auth-gate{display:none !important}
.auth-gate{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:linear-gradient(157deg,#0E1826 0%,#0B121F 55%,#070B12 100%)}
:root[data-theme="day"] .auth-gate{background:linear-gradient(157deg,#F4FAFF 0%,#EEF5FC 55%,#DCEAF7 100%)}
.ag-logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:#fff;padding:10px;box-shadow:var(--shadow-card);animation:agPulse 2.2s ease-in-out infinite}
.ag-logo img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes agPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(.96)}}
.ag-row{display:flex;align-items:center;gap:10px}
.ag-spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--primary);animation:spin .7s linear infinite}
.ag-text{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-3)}

/* ═══ Shell ═══ */
.app-shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border-2);display:flex;flex-direction:column;padding:20px 14px;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.sb-brand__logo{width:38px;height:38px;border-radius:11px;background:#fff;padding:5px;display:grid;place-items:center;flex:none;overflow:hidden}
.sb-brand__logo img{width:100%;height:100%;object-fit:contain;display:block}
.sb-brand__name{font-weight:800;font-size:16px;letter-spacing:-.4px}
.sb-brand__sub{font-size:9.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace}
.sb-group{margin-top:14px}
.sb-group__label{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);padding:0 10px 8px}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text-2);transition:all .15s;position:relative}
.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item.is-active{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;box-shadow:0 6px 18px var(--primary-glow)}
.sb-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sb-item .badge{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.4px;background:var(--highlight);color:#071018;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.sb-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary-soft),var(--primary));display:grid;place-items:center;font-weight:800;font-size:12px;color:#071018;flex:none}
.sb-user{flex:1;min-width:0}
.sb-user__name{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user__plan{font-size:10px;color:var(--text-3)}
.sb-logout{color:var(--text-3);padding:6px}
.sb-logout:hover{color:var(--danger)}

.main{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:none;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-2);background:var(--surface);position:sticky;top:0;z-index:20}
.topbar__brand{display:flex;align-items:center;gap:8px;font-weight:800}
.topbar__brand .sb-brand__logo{width:30px;height:30px}
.icon-btn{width:36px;height:36px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border-2);display:grid;place-items:center;color:var(--text-2);flex:none;position:relative}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.topbar-actions{display:flex;gap:8px;margin-left:auto}

.content{flex:1;padding:26px 32px 90px;max-width:1180px;width:100%;margin:0 auto}
.page-head{margin-bottom:22px}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
.page-head p{color:var(--text-2);font-size:13px;margin-top:4px}

.card{background:var(--surface);border:1px solid var(--border-2);border-radius:18px;padding:20px}
.grid{display:grid;gap:16px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:920px){.grid-3,.grid-2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:100px;font-weight:700;font-size:13.5px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;box-shadow:0 10px 26px var(--primary-glow)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-outline{background:var(--surface-2);border-color:var(--border-2);color:var(--text)}
.btn-outline:hover{border-color:var(--primary)}
.btn-danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.btn-sm{padding:8px 14px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}

.empty{text-align:center;padding:50px 20px;color:var(--text-3)}
.empty svg{width:38px;height:38px;stroke:var(--text-3);fill:none;stroke-width:1.6;margin:0 auto 14px}
.empty h3{color:var(--text-2);font-size:15px;margin-bottom:6px}
.empty p{font-size:12.5px;max-width:320px;margin:0 auto}

.theme-toggle-panel{width:36px;height:36px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border-2);display:grid;place-items:center;color:var(--text-2)}
.theme-toggle-panel svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ═══ Paywall lock ═══ */
.lock-box{border:1.5px dashed var(--border-strong);border-radius:16px;padding:32px 24px;text-align:center;background:var(--surface-2)}
.lock-box svg{width:34px;height:34px;stroke:var(--primary-soft);fill:none;stroke-width:1.6;margin:0 auto 14px}
.lock-box h3{font-size:15px;margin-bottom:6px}
.lock-box p{font-size:12.5px;color:var(--text-2);max-width:320px;margin:0 auto 18px}

/* ═══ Plan picker (Suscripción) ═══ */
.plan-picker{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px}
@media(max-width:700px){.plan-picker{grid-template-columns:1fr}}
.plan-card{border:2px solid var(--border-2);border-radius:16px;padding:22px;cursor:pointer;transition:all .18s;position:relative;background:var(--surface)}
.plan-card:hover{border-color:var(--primary-soft)}
.plan-card.is-selected{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.plan-card .tag{position:absolute;top:-11px;left:18px;background:var(--highlight);color:#071018;font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 10px;border-radius:20px;text-transform:uppercase}
.plan-card .label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;font-weight:700;font-family:'JetBrains Mono',monospace}
.plan-card .amount{font-size:32px;font-weight:800;letter-spacing:-1px;margin:6px 0}
.plan-card .amount span{font-size:13px;font-weight:500;color:var(--text-2)}
.plan-card .note{font-size:11.5px;color:var(--text-2)}
#sub-checkout-mount{margin-top:20px;max-width:520px}
.sub-status-card{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.sub-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
.sub-pill.ok{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success)}
.sub-pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}

/* ═══ Mobile ═══ */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border-2);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bottom-nav__row{display:flex;justify-content:space-around}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-3);font-size:9.5px;font-weight:700;padding:4px 10px}
.bn-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.bn-item.is-active{color:var(--primary)}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.is-open{display:block}
.drawer__backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.drawer__panel{position:absolute;top:0;left:0;bottom:0;width:82%;max-width:300px;background:var(--surface);padding:20px 14px;overflow-y:auto;animation:fadeUp .25s ease}

@media(max-width:960px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{display:flex}
  .content{padding:18px 16px 100px}
  .bottom-nav{display:block}
}

/* ═══ Modal genérico ═══ */
.modal-overlay{position:fixed;inset:0;background:rgba(4,8,14,.6);z-index:9990;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.is-open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border-2);border-radius:20px;padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow-card);animation:fadeUp .25s ease}
.modal-box h3{font-size:16px;margin-bottom:10px}
.modal-box p{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:18px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

.toast-zone{position:fixed;bottom:90px;right:20px;z-index:9995;display:flex;flex-direction:column;gap:8px}
@media(max-width:960px){.toast-zone{bottom:100px;right:12px;left:12px}}
.toast{background:var(--surface);border:1px solid var(--border-2);border-radius:12px;padding:12px 16px;font-size:12.5px;box-shadow:var(--shadow-card);animation:fadeUp .25s ease}
.toast.ok{border-color:color-mix(in srgb,var(--success) 40%,transparent)}
.toast.err{border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
</style>
</head>
<body>

<!-- Gate de sesión -->
<div class="auth-gate" id="auth-gate">
  <div class="ag-logo"><img src="assets/img/synova-logo.png" alt="SYNOVA México"></div>
  <div class="ag-row"><div class="ag-spinner"></div><span class="ag-text">Cargando tu panel…</span></div>
</div>
<script>setTimeout(function(){ if (window.__synPanelBooted) return; document.body.classList.add('auth-ready'); }, 6000);</script>

<div class="app-shell">
  <!-- Sidebar desktop -->
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand__logo"><img src="assets/img/synova-logo.png" alt="SYNOVA México"></div>
      <div><div class="sb-brand__name">SYNOVA</div><div class="sb-brand__sub">Panel VIP</div></div>
    </div>

    <nav id="sb-nav">
      <div class="sb-group">
        <div class="sb-group__label">Principal</div>
        <a class="sb-item" data-section="inicio"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Inicio</a>
        <a class="sb-item" data-section="cursos"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Mis cursos</a>

        <a class="sb-item" data-section="pdfs"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Material descargable</a>
        <a class="sb-item" data-section="certificados"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M9 14l-2 7 5-3 5 3-2-7"/></svg>Certificados</a>
      </div>
      <div class="sb-group">
        <div class="sb-group__label">Herramientas pro</div>
        <a class="sb-item" data-section="herramientas"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Herramientas SYNOVA<span class="badge">Pronto</span></a>
      </div>
      <div class="sb-group">
        <div class="sb-group__label">Comunidad</div>
        <a class="sb-item" data-section="foro"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Foro VIP</a>
        <a class="sb-item" data-section="directorio"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Directorio VIP</a>
      </div>
      <div class="sb-group">
        <div class="sb-group__label">Mi cuenta</div>
        <a class="sb-item" data-section="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Mi perfil</a>
        <a class="sb-item" data-section="suscripcion"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Suscripción</a>
      </div>
    </nav>

    <div class="sb-footer">
      <div class="sb-avatar" id="sb-avatar">··</div>
      <div class="sb-user"><div class="sb-user__name" id="sb-user-name">Cargando…</div><div class="sb-user__plan" id="sb-user-plan">—</div></div>
      <button class="icon-btn sb-logout" id="btn-theme-toggle" title="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79z"/></svg></button>
      <button class="icon-btn sb-logout" id="btn-logout" title="Cerrar sesión"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </aside>

  <div class="main">
    <!-- Topbar mobile -->
    <header class="topbar">
      <div class="topbar__brand">
        <div class="sb-brand__logo"><img src="assets/img/synova-logo.png" alt="SYNOVA México"></div>
        SYNOVA
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-notif"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot" id="notif-dot" style="display:none"></span></button>
        <button class="icon-btn" id="btn-drawer"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      </div>
    </header>

    <main class="content" id="content">
      <div class="empty"><div class="ag-spinner" style="margin:0 auto 14px"></div><p>Cargando SYNOVA…</p></div>
    </main>
  </div>
</div>

<!-- Drawer móvil -->
<div class="drawer" id="drawer">
  <div class="drawer__backdrop" id="drawer-backdrop"></div>
  <div class="drawer__panel" id="drawer-panel"></div>
</div>

<!-- Bottom nav móvil -->
<nav class="bottom-nav">
  <div class="bottom-nav__row">
    <a class="bn-item" data-section="inicio"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Inicio</a>
    <a class="bn-item" data-section="cursos"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Cursos</a>
    <a class="bn-item" data-section="foro"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Foro</a>
    <a class="bn-item" data-section="suscripcion"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Plan</a>
  </div>
</nav>

<!-- Modal genérico de confirmación -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<div class="toast-zone" id="toast-zone"></div>

<script>
/* ═══════════════════ TEMA ═══════════════════ */
const Theme = {
  init(){ document.documentElement.dataset.theme = localStorage.getItem('synova-panel:theme') || 'night'; },
  toggle(){
    const n = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
    document.documentElement.dataset.theme = n;
    localStorage.setItem('synova-panel:theme', n);
  }
};
Theme.init();
document.getElementById('btn-theme-toggle').addEventListener('click', () => Theme.toggle());

/* ═══════════════════ TOASTS ═══════════════════ */
function toast(msg, type){
  const z = document.getElementById('toast-zone');
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'error' ? 'err' : 'ok');
  el.textContent = msg;
  z.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function iniciales(nombre, email){
  const base = (nombre || email || '?').trim();
  const partes = base.split(' ').filter(Boolean);
  if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
  return base.slice(0, 2).toUpperCase();
}

async function resolverMembresia(uid){
  let membership = null;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    const r = await fetch(`${WEBHOOK_URL}/membership/${uid}`, { signal: ctrl.signal });
    clearTimeout(t);
    if (r.ok) membership = await r.json();
  } catch (e) { console.warn('[SYNOVA] webhook /membership no respondió, usando fallback Firestore:', e.message); }

  const snap = await getDoc(doc(db, 'miembros', uid));
  const d = snap.exists() ? snap.data() : {};

  if (!membership) {
    const exp = d.expiraEn || d.fechaFinAcceso || null;
    const expDate = exp ? (exp.toDate ? exp.toDate() : new Date(exp)) : null;
    const vigente = (d.activa === true || d.activo === true) && (!expDate || expDate.getTime() > Date.now());
    membership = { activo: vigente, activa: vigente, plan: d.plan || null };
  }
  return {
    membership,
    cancelacionProgramada: !!d.cancelacionProgramada,
    fechaFinAcceso: d.fechaFinAcceso || null,
    docData: d
  };
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'vip-auth.html'; return; }
  const email = (user.email || '').toLowerCase();
  const isAdmin = ADMIN_EMAILS.includes(email);

  let modo = 'sin-membresia', plan = null, membership = null, cancelacionProgramada = false, fechaFinAcceso = null;

  if (isAdmin) {
    modo = 'vip'; plan = 'admin';
  } else {
    const r = await resolverMembresia(user.uid);
    membership = r.membership;
    cancelacionProgramada = r.cancelacionProgramada;
    fechaFinAcceso = r.fechaFinAcceso;
    if (membership && (membership.activo || membership.activa)) { modo = 'vip'; plan = membership.plan || 'mensual'; }
  }

  window.UserState = {
    uid: user.uid, email, displayName: user.displayName || '',
    nombre: user.displayName || email.split('@')[0],
    iniciales: iniciales(user.displayName, email),
    isAdmin, modo, plan, membership, cancelacionProgramada, fechaFinAcceso
  };

  document.getElementById('sb-avatar').textContent = window.UserState.iniciales;
  document.getElementById('sb-user-name').textContent = window.UserState.nombre;
  document.getElementById('sb-user-plan').textContent = isAdmin ? 'Administrador' : (modo === 'vip' ? ('Plan ' + (plan === 'anual' ? 'Anual' : 'Mensual')) : 'Sin membresía');

  document.body.classList.add('auth-ready');
  window.dispatchEvent(new CustomEvent('synova:ready'));

  const params = new URLSearchParams(location.search);
  const seccionInicial = params.get('seccion') || (params.get('checkout') === 'success' ? 'suscripcion' : 'inicio');
  navigateTo(seccionInicial);

  if (params.get('checkout') === 'success') {
    setTimeout(() => toast('¡Pago recibido! Tu membresía VIP se activa en unos segundos.', 'ok'), 400);
  }

  setupNotificaciones(user.uid);
});

});

/* ═══════════════════ NOTIFICACIONES (colección global) ═══════════════════ */
function setupNotificaciones(uid){
  try {
    const q = query(collection(db, 'notificaciones'), orderBy('createdAt', 'desc'), limit(15));
    onSnapshot(q, (snap) => {
      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      window.__notifs = items;
      let leidas = [];
      try { leidas = JSON.parse(localStorage.getItem('synova_notif_read_' + uid) || '[]'); } catch(e){}
      const nuevas = items.filter(n => !leidas.includes(n.id)).length;
      document.getElementById('notif-dot').style.display = nuevas > 0 ? 'block' : 'none';
    }, (err) => console.warn('[SYNOVA] notificaciones:', err.message));
  } catch (e) { console.warn('[SYNOVA] setupNotificaciones error', e.message); }
}
document.getElementById('btn-notif').addEventListener('click', () => {
  const items = window.__notifs || [];
  const uid = window.UserState?.uid;
  try { localStorage.setItem('synova_notif_read_' + uid, JSON.stringify(items.map(i => i.id))); } catch(e){}
  document.getElementById('notif-dot').style.display = 'none';
  const html = items.length
    ? items.map(n => `<div style="padding:10px 0;border-bottom:1px solid var(--border)"><b style="font-size:12.5px">${escHtml(n.titulo||'')}</b><p style="font-size:11.5px;color:var(--text-2);margin-top:2px">${escHtml(n.descripcion||'')}</p></div>`).join('')
    : '<p style="color:var(--text-3);font-size:12.5px;text-align:center;padding:20px 0">Sin notificaciones por ahora.</p>';
  abrirModal(`<h3>Notificaciones</h3><div style="max-height:340px;overflow-y:auto">${html}</div><div class="modal-actions" style="margin-top:14px"><button class="btn btn-outline btn-sm" onclick="cerrarModal()">Cerrar</button></div>`);
});
window.cerrarModal = cerrarModal;
window.escHtml = function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); };
function escHtml(s){ return window.escHtml(s); }
</script>

async function leerPrecios(){
  try {
    const snap = await window.__fs.getDoc(window.__fs.doc(window.__fs.db, 'config', 'club'));
    const c = snap.exists() ? snap.data() : {};
    const mes = Number(c.precioMes) || 199;
    const ano = Number(c.precioAno) || 1899;
    return { mes, ano, equivMes: Math.round(ano / 12), ahorro: Math.max(0, (mes * 12) - ano) };
  } catch (e) { console.warn('[SYNOVA] leerPrecios fallback:', e.message); return { mes: 199, ano: 1899, equivMes: 158, ahorro: 489 }; }
}

  document.getElementById('content').innerHTML = `
    <div class="page-head"><h1>Suscripción</h1><p>Elige tu plan y activa tu membresía VIP de SYNOVA.</p></div>
    <div class="plan-picker">
      <div class="plan-card is-selected" data-plan="mensual" onclick="seleccionarPlan('mensual')">
        <div class="label">Mensual</div>
        <div class="amount">${fmt(precios.mes)} <span>MXN/mes</span></div>

      </div>
      <div class="plan-card" data-plan="anual" onclick="seleccionarPlan('anual')">

window.seleccionarPlan = function(plan){
  window.__planSeleccionado = plan;
  document.querySelectorAll('.plan-card').forEach(c => c.classList.toggle('is-selected', c.dataset.plan === plan));
};

window.iniciarCheckout = async function(){
  const S = window.UserState;
  const plan = window.__planSeleccionado || 'mensual';
  const mount = document.getElementById('sub-checkout-mount');
  mount.innerHTML = '<div class="empty"><div class="ag-spinner" style="margin:0 auto"></div><p style="margin-top:10px">Preparando tu pago…</p></div>';
  if (window.__synovaCheckout) { try { window.__synovaCheckout.destroy(); } catch(e){} }
  try {
    const r = await fetch(window.__WEBHOOK_URL + '/stripe/checkout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan, uid: S.uid, email: S.email })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'No se pudo iniciar el pago');
    const stripe = Stripe(window.__STRIPE_PK);
    mount.innerHTML = '';
    window.__synovaCheckout = await stripe.initEmbeddedCheckout({ clientSecret: data.clientSecret });
    window.__synovaCheckout.mount('#sub-checkout-mount');
  } catch (e) {
    mount.innerHTML = `<div class="empty"><h3>No se pudo iniciar el pago</h3><p>${escHtml(e.message)}<br><br>Esto es normal si Stripe/Firebase/Railway de SYNOVA todavía no están configurados — falta conectar las credenciales reales.</p></div>`;
  }
};

window.confirmarCancelacion = function(){
  abrirModal(`<h3>¿Cancelar tu membresía?</h3><p>Perderás acceso a los cursos y herramientas VIP al final de tu periodo actual. Puedes reactivar antes de que expire.</p>
    <div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="cerrarModal()">No, mantener</button><button class="btn btn-danger btn-sm" onclick="cancelarSuscripcion()">Sí, cancelar</button></div>`);
};
window.cancelarSuscripcion = async function(){
  const S = window.UserState;
  cerrarModal();
  try {
    const r = await fetch(window.__WEBHOOK_URL + '/stripe/cancel-subscription', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ uid:S.uid, email:S.email }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    S.cancelacionProgramada = true; S.fechaFinAcceso = data.finAcceso;
    toast('Cancelación programada correctamente', 'ok');
    renderSuscripcionVIP();
  } catch (e) { toast('No se pudo cancelar: ' + e.message, 'error'); }
};
window.reactivarSuscripcion = async function(){
  const S = window.UserState;
  try {
    const r = await fetch(window.__WEBHOOK_URL + '/stripe/reactivate-subscription', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ uid:S.uid, email:S.email }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    S.cancelacionProgramada = false;
    toast('Tu membresía se reactivó', 'ok');
    renderSuscripcionVIP();
  } catch (e) { toast('No se pudo reactivar: ' + e.message, 'error'); }
};
window.abrirPortalFacturacion = async function(){
  const S = window.UserState;
  try {
    const r = await fetch(window.__WEBHOOK_URL + '/stripe/create-billing-portal', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ uid:S.uid, email:S.email, returnUrl: location.href }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    window.location.href = data.url;
  } catch (e) { toast('No se pudo abrir el portal: ' + e.message, 'error'); }
};

/* ── Helper genérico para listar colecciones Firestore con estado vacío ── */
async function renderListaFirestore(coleccion, targetId, opts){
  try {
    const { collection, getDocs, query, orderBy, where } = window.__fs;
    let ref = collection(window.__fs.db, coleccion);
    const clauses = [];
    if (opts.ordenarPor) clauses.push(orderBy(opts.ordenarPor, opts.asc ? 'asc' : 'desc'));
    if (opts.where) clauses.push(where(opts.where[0], opts.where[1], opts.where[2]));
    const q = clauses.length ? query(ref, ...clauses) : ref;
    const snap = await getDocs(q);
    const el = document.getElementById(targetId);
    if (!el) return;
    if (snap.empty) { el.innerHTML = `<div class="empty"><h3>${opts.vacioTitulo}</h3><p>${opts.vacioTexto}</p></div>`; return; }
    let html = '';
    snap.forEach(d => { html += opts.tarjeta({ id: d.id, ...d.data() }); });
    el.innerHTML = html;
  } catch (e) {
    const el = document.getElementById(targetId);
    if (el) el.innerHTML = `<div class="empty"><h3>${opts.vacioTitulo}</h3><p>${opts.vacioTexto}</p></div>`;
    console.warn('[SYNOVA] renderListaFirestore(' + coleccion + '):', e.message);
  }
}
